name: Keep FLOWSIGHT deployment awake

on:
  schedule:
    # FastAPI Cloud scales to zero after inactivity, so the first visitor of
    # each idle period pays a cold start and the ephemeral SQLite database is
    # re-seeded, discarding anything written since the last sleep. Pinging
    # /api/health keeps the instance warm and preserves data across idle gaps.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # Override with a repository variable named APP_URL if the app is ever
          # deployed somewhere else. The literal default means keep-alive works
          # with no repository configuration at all.
          APP_URL: ${{ vars.APP_URL || 'https://flowsight-app.fastapicloud.dev' }}
        run: |
          echo "pinging $APP_URL"
          curl -fsS --max-time 60 -w "pong: HTTP %{http_code} in %{time_total}s\n" -o /dev/null "$APP_URL/api/health"
